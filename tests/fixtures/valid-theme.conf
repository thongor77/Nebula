[General]
; Neutral base values — identical to NebulaThemeConfig's own fallback
; ("minimal theme", see docs/Theme-System.md §5). Copy this file when
; starting a new theme and only change what your identity actually needs
; — see docs/Theme-SDK.md §3 and docs/Design-Tokens-Reference.md for the
; full list of tokens and what they control.
;
; fontWeightNormal/fontWeightBold are intentionally absent: they are
; valued directly with Qt's Font.Normal/Font.Bold enum (see
; docs/Core-Implementation-Status.md, D4), not overridable via theme.conf.

primaryColor=#4a90d9
secondaryColor=#6c7a89
accentColor=#f0a030
backgroundColor=#1e1e1e
surfaceColor=#2a2a2a
textPrimary=#f0f0f0
textSecondary=#a0a0a0
errorColor=#d9534f
successColor=#5cb85c

spacingXs=4
spacingSm=8
spacingMd=16
spacingLg=24
spacingXl=32

radiusSmall=4
radiusMedium=8
radiusLarge=16
radiusPill=9999

fontFamilyPrimary=sans-serif
fontFamilySecondary=sans-serif
fontSizeTitle=24
fontSizeBody=14
fontSizeClock=32

durationFast=120
durationNormal=250
durationSlow=500

overlayOpacity=0.35
surfaceOpacity=1.0
surfaceBorderWidth=1

opacityDisabled=0.5
scalePressed=0.97
pressedDarkenFactor=1.3
borderWidthThin=1
borderWidthFocus=2
