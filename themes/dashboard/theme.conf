[General]
; Dashboard — grayscale "architectural/premium" identity (Phase C of
; Nebula-Dashboard-Grayscale-Network-Implementation-Brief.md, replacing
; the earlier cosmic indigo/violet direction). Personality now comes
; from proportion/typography/spacing/hierarchy/surfaces, not color — see
; docs/Dashboard-Architecture-Stress-Test.md Gap 2: this file still
; intentionally carries no Dashboard-specific key, only Design System
; tokens NebulaThemeConfig already knows.
;
; primaryColor is deliberately a dark graphite, not a light "brand"
; tone: NebulaButton's primary variant always renders its label in
; textPrimary regardless of variant (Core limitation, unchanged — see
; docs/Core-Refinement-Review.md), so a dark primaryColor is what keeps
; the Unlock button legible. Contrast (sRGB relative-luminance, same
; method as the previous violet palette): textPrimary on primaryColor
; measures ~11.4:1 — passes WCAG AA for both large and small text,
; clearly ahead of the previous ~3.38:1 (a side effect of going
; monochrome, not a deliberate contrast-fix task).
;
; accentColor is the one restrained non-neutral note allowed by the
; brief ("at most one very subtle accent for focus/selection") — a cool
; steel-blue used only for focus rings (NebulaButton, NebulaPasswordField
; focus states), never for network status (brief §6 explicitly rules out
; bright green/red for that — the network panel uses ●/○ glyphs and
; opacity instead, see components/NetworkStatus.qml).

