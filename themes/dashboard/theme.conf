[General]
; Dashboard — cosmic indigo/violet identity (leans into the project's own
; name for its GitHub showcase), deliberately distinct from Nord
; (blue/sober) and Glass (frosted neutral). No GPU blur/shader (Core
; doesn't have one, see docs/Rendering-Guidelines.md) — depth comes from
; surfaceOpacity/overlayOpacity plus the wallpaper alone, same approach
; as Glass. Only Design System tokens already known to NebulaThemeConfig
; — see docs/Dashboard-Architecture-Stress-Test.md Gap 2: this file
; intentionally does NOT carry any Dashboard-specific key (breakpoints,
; panel visibility, ...) — those are plain QML properties in Main.qml
; instead, proving that path needs no Core/loader change.
;
; Contrast measured (sRGB relative-luminance, same method as Phase 3.1):
; textPrimary on primaryColor (Unlock button label) is 3.38:1 — passes
; WCAG AA for large text, not small text. Same known, already-documented
; Core limitation Glass has (~3.6:1): NebulaButton always uses
; textPrimary regardless of variant, no dedicated "text on primary"
; token exists yet (see docs/Core-Refinement-Review.md). Not a
; regression introduced here, not fixed here either — same rationale as
; Glass, tracked for a future Design Tokens phase.

backgroundColor=#0B0A18
surfaceColor=#171532
textPrimary=#ECEAFF
textSecondary=#9A96C4
primaryColor=#7C6CF0
secondaryColor=#3A3560
accentColor=#FF7A9C
errorColor=#FF5C6C
successColor=#4ED8A0

radiusLarge=14
radiusMedium=8

overlayOpacity=0.4
surfaceOpacity=0.85
surfaceBorderWidth=1

; Brought up from the Core default (120ms) into the brief's requested
; 150-250ms range, same reasoning as Glass.
durationFast=150

fontFamilyPrimary=Noto Sans
fontFamilySecondary=Noto Sans
