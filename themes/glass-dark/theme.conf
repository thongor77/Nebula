[General]
; Glass — dark variant (Phase 3.0, see docs/Glass-Theme-Report.md).
; Fluent Design / modern Breeze / macOS Sonoma inspired — sober, no
; GPU blur (Core doesn't have one yet, see docs/Rendering-Guidelines.md),
; the "glass" feel comes entirely from NebulaSurface/NebulaOverlay
; opacity tokens plus a soft wallpaper showing through.
;
; glass-light shares every token name with this file — only the values
; differ (see docs/Glass-Theme-Report.md for the shared palette
; rationale).

backgroundColor=#1C1C1E
surfaceColor=#2C2C2E
textPrimary=#FFFFFF
textSecondary=#A0A0A5
primaryColor=#0A84FF
secondaryColor=#3A3A3C
accentColor=#5E5CE6
errorColor=#FF453A
successColor=#32D74B

radiusLarge=20
radiusMedium=10

overlayOpacity=0.25
surfaceOpacity=0.75
surfaceBorderWidth=1

; Brought up from the Core default (120ms) to sit inside the brief's
; requested 150-250ms range for Glass's animations — durationNormal
; (250ms) already fits, only durationFast needed a per-theme override.
durationFast=150

fontFamilyPrimary=Noto Sans
fontFamilySecondary=Noto Sans
