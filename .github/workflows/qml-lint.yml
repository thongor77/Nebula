name: QML Lint

# Core components landed in Phase 1.1 (docs/Core-Implementation-Status.md).
# `--warnings-as-errors` was removed: it does not exist on the qmllint
# shipped with Qt 6.11 (verified locally — see
# docs/Core-Implementation-Status.md). Plain `qmllint` already exits
# non-zero on real errors without that flag.

on:
  pull_request:
    paths:
      - "**/*.qml"
      - "**/*.js"
  push:
    branches: [main]
    paths:
      - "**/*.qml"
      - "**/*.js"

jobs:
  qmllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 (qmllint)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          modules: "qtdeclarative"

      - name: Run qmllint on all QML files
        run: |
          set -e
          files=$(find . -name "*.qml" -not -path "./.git/*")
          if [ -z "$files" ]; then
            echo "No QML files yet — nothing to lint."
            exit 0
          fi
          echo "$files" | xargs qmllint
